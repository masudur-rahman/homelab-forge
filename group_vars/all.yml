---
ntp_servers:
  - time.google.com
  - pool.ntp.org

timezone: UTC
container_runtime: docker
dns_servers:
  - 1.1.1.1
  - 8.8.8.8

floating_ip_interface: eth0

# Central IP Map
# - VIPs / external hosts: literal values
# - Inventory hosts: sourced from hosts.ini via hostvars (do not duplicate)
ips:
  # VIPs / external
  router: "10.66.0.1"
  adguard: "10.66.0.253"
  proxmox: "10.66.0.10"
  # Inventory hosts (resolved lazily; only available in their own env)
  gateway_01: "{{ hostvars['gateway-01'].ansible_host | default('') }}"
  gateway_02: "{{ hostvars['gateway-02'].ansible_host | default('') }}"
  data: "{{ hostvars['data-01'].ansible_host | default('') }}"
  expense_tracker: "{{ hostvars['expense-tracker-01'].ansible_host | default('') }}"
  monitoring: "{{ hostvars['monitoring-01'].ansible_host | default('') }}"
  portal: "{{ hostvars['portal-01'].ansible_host | default('') }}"

# Global Network Settings
primary_dns: "{{ ips.adguard }}"
fallback_dns: "1.1.1.1"
search_domain: "mrahman.xyz"

# AdGuard (shared across envs — needed by ingress sync from compute)
adguard_port_web: 3000
adguard_admin_user: admin
