---
ntp_servers:
  - time.google.com
  - pool.ntp.org

timezone: UTC
container_runtime: docker
dns_servers:
  - 1.1.1.1
  - 8.8.8.8

floating_ip_interface: eth0

# Central IP Map
# - VIPs / external hosts: literal values
# - Inventory hosts: sourced from hosts.ini via hostvars (do not duplicate)
ips:
  # VIPs / external
  router: "10.66.0.1"
  adguard: "10.66.0.253"
  proxmox: "10.66.0.10"
  k8s_gateway: "10.66.0.150"  # Cilium Gateway LoadBalancer VIP (olympus)
  # Inventory hosts (resolved lazily; only available in their own env)
  gateway_01: "{{ hostvars['gateway-01'].ansible_host | default('') }}"
  gateway_02: "{{ hostvars['gateway-02'].ansible_host | default('') }}"
  data: "{{ hostvars['data-01'].ansible_host | default('') }}"
  expense_tracker: "{{ hostvars['expense-tracker-01'].ansible_host | default('') }}"
  monitoring: "{{ hostvars['monitoring-01'].ansible_host | default('') }}"
  portal: "{{ hostvars['portal-01'].ansible_host | default('') }}"

# Global Network Settings
primary_dns: "{{ ips.adguard }}"
fallback_dns: "1.1.1.1"
search_domain: "mrahman.xyz"

# Ingress (Nginx Reverse Proxy) — env-agnostic domain map
ingress_root_domain: "mrahman.xyz"
ingress_cert_email: "masudjuly02@gmail.com"
ingress_sites:
  - domain: "gateway.mrahman.xyz"
    upstream: "http://{{ ips.router }}"
    force_ip_header: true
  - domain: "proxmox.mrahman.xyz"
    upstream: "https://{{ ips.proxmox }}:8006"
    websocket: true
  - domain: "adguard.mrahman.xyz"
    upstream: "http://{{ ips.adguard }}:3000"
    websocket: false
  - domain: "status.mrahman.xyz"
    upstream: "http://{{ ips.monitoring }}:3001"
    websocket: true
  - domain: "netdata.mrahman.xyz"
    upstream: "http://{{ ips.monitoring }}:19999"
    websocket: false
  - domain: "khorcha-pati.mrahman.xyz"
    upstream: "http://{{ ips.expense_tracker}}:65262"
    websocket: false
  - domain: "khorcha-pati-api.mrahman.xyz"
    upstream: "http://{{ ips.expense_tracker}}:6336"
    websocket: false

# Cluster apps served by the k8s Gateway. Internally they resolve straight to
# the Gateway VIP (ips.k8s_gateway) via DNS rewrite; the nginx stream block uses
# this same list to SNI-passthrough external traffic to the Gateway (no local cert).
ingress_passthrough_hosts:
  - grafana.mrahman.xyz
  - hubble.mrahman.xyz
  - pawsitively.mrahman.xyz
  - family.mrahman.xyz

# Cleanup settings (used by cleanup tasks with tags: [never, cleanup])
cleanup_prune_volumes: true
cleanup_log_retention_days: 30
cleanup_cert_backup_retention_days: 90
