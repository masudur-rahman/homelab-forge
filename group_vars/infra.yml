---
current_directory: "{{ lookup('env', 'PWD') }}"

# --- VPN Config ---
vpn_wireguard_setup: true
vpn_wireguard_endpoint: 103.49.169.50
vpn_wireguard_key_path: "{{ current_directory }}/files/wireguard"
vpn_wireguard_interface_ip: "10.8.0.1"
vpn_wireguard_port: 51820

gateway_floating_ip: "{{ ips.adguard }}"
gateway_floating_ip_router_id: 50
gateway_floating_ip_auth_pass: "{{ vault_gateway_floating_ip_auth_pass }}"
gateway_floating_ip_instance_name: "GATEWAY"

vpn_wireguard_clients:
- name: masud-android
  ip: "10.8.0.2"
- name: masud-macbook
  ip: "10.8.0.3"

# --- AdGuard Home ---
adguard_version: "v0.107.73"
adguard_bind_ip: "0.0.0.0"
adguard_port_dns: 53
adguard_port_web: 3000
adguard_upstreams:
  - "1.1.1.1"
  - "8.8.8.8"

# AdGuard API auth (optional — empty means no auth, used by DNS rewrite sync)
adguard_admin_user: admin
adguard_admin_password: "{{ vault_adguard_admin_password | default('') }}"

# Extra AdGuard DNS rewrites not fronted by nginx ingress
adguard_extra_rewrites:
  - { domain: data.mrahman.xyz, answer: "{{ ips.data }}" }
  - { domain: cache.mrahman.xyz, answer: "{{ ips.data }}" }
