---
- name: Tap required Homebrew repositories on the controller
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ k8s_platform_brew_taps }}"
  loop_control:
    label: "{{ item }}"
  become: false

- name: Ensure required CLI tools are installed on the controller
  community.general.homebrew:
    name: "{{ k8s_platform_brew_formulae }}"
    state: present
  become: false

- name: Ensure required Python libraries are installed on the controller
  # Invoked via the interpreter directly, not the pip module: the pip module
  # imports 'packaging', which is one of the libs we are bootstrapping here.
  # Homebrew Python is PEP 668 externally-managed, hence --break-system-packages.
  ansible.builtin.command: >-
    {{ ansible_facts.discovered_interpreter_python | default('python3') }}
    -m pip install --break-system-packages {{ k8s_platform_pip_packages | join(' ') }}
  register: k8s_platform_pip_install
  changed_when: "'Successfully installed' in k8s_platform_pip_install.stdout"
  become: false
  tags:
    - skip_ansible_lint

- name: Stat the kubeconfig file
  ansible.builtin.stat:
    path: "{{ kubeconfig | default('') }}"
  register: k8s_platform_kubeconfig_stat

- name: Assert kubeconfig is available
  ansible.builtin.assert:
    that:
      - kubeconfig is defined
      - kubeconfig | length > 0
      - k8s_platform_kubeconfig_stat.stat.exists
    fail_msg: >-
      kubeconfig not found at '{{ kubeconfig | default("<undefined>") }}'.
      Run 'make inventory env=compute' to copy it from homelab-genesis.
    success_msg: "kubeconfig present at {{ kubeconfig }}"

- name: Assert SOPS age key is available
  ansible.builtin.assert:
    that:
      - vault_olympus_age_key is defined
      - vault_olympus_age_key | length > 0
    fail_msg: "vault_olympus_age_key is missing from vault/compute.yml"
    success_msg: "SOPS age key present"

- name: Fetch cluster nodes
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    kind: Node
  register: k8s_platform_nodes

- name: Report cluster readiness
  ansible.builtin.debug:
    msg: "olympus reachable — {{ k8s_platform_nodes.resources | length }} node(s) found"
