---
- name: Run preflight checks
  ansible.builtin.import_tasks: preflight.yml
  tags:
    - always

- name: Install Gateway API CRDs
  ansible.builtin.import_tasks: gateway_api.yml
  tags:
    - gateway_api

- name: Install cert-manager and Porkbun webhook
  ansible.builtin.import_tasks: cert_manager.yml
  tags:
    - cert_manager

- name: Install observability stack
  ansible.builtin.import_tasks: monitoring.yml
  tags:
    - monitoring

# Phases added incrementally (each touches the live cluster):
#   flux.yml          — Flux + sops-age secret + GitRepository + root Kustomization
