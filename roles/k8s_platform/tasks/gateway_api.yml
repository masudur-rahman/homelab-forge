---
# Gateway API is a platform prerequisite owned by homelab-genesis (Terraform):
# it installs the Gateway API CRDs (standard channel + the experimental TLSRoute
# CRD that Cilium requires) and runs Cilium with gatewayAPI.enabled=true, which
# makes the cilium-operator create the 'cilium' GatewayClass. Forge only asserts
# the platform is ready; Gateways and HTTPRoutes are reconciled from the gitops repo.
- name: Fetch the cilium GatewayClass
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: gateway.networking.k8s.io/v1
    kind: GatewayClass
    name: "{{ k8s_platform_gateway_class }}"
  register: k8s_platform_gatewayclass
  tags:
    - gateway_api

- name: Assert the GatewayClass exists and is accepted
  ansible.builtin.assert:
    that:
      - k8s_platform_gatewayclass.resources | length > 0
      - >-
        k8s_platform_gatewayclass.resources[0].status.conditions
        | selectattr('type', 'eq', 'Accepted')
        | selectattr('status', 'eq', 'True') | list | length > 0
    fail_msg: >-
      GatewayClass '{{ k8s_platform_gateway_class }}' not found or not accepted.
      Gateway API CRDs and the Cilium gateway controller are provisioned by
      homelab-genesis — install the Gateway API CRDs (standard + experimental
      TLSRoute) and set gatewayAPI.enabled=true on Cilium there.
    success_msg: "GatewayClass '{{ k8s_platform_gateway_class }}' is accepted"
  tags:
    - gateway_api
