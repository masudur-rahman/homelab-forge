---
- name: Install Nginx Stream Module
  ansible.builtin.apt:
    name: libnginx-mod-stream
    state: present
    update_cache: true

- name: Ensure Nginx Configuration Directory Exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/nginx/conf.d
    - /etc/nginx/streams.d

- name: Enable Stream Block Include In nginx.conf
  ansible.builtin.blockinfile:
    path: /etc/nginx/nginx.conf
    marker: "# {mark} ANSIBLE MANAGED: stream include"
    block: |
      stream {
          include /etc/nginx/streams.d/*.conf;
      }
  notify: Reload Nginx

- name: Upload TLS Passthrough Stream Configuration
  ansible.builtin.template:
    src: stream.conf.j2
    dest: /etc/nginx/streams.d/tls-passthrough.conf
    mode: '0644'
  loop: "{{ ingress_passthrough_hosts }}"
  loop_control:
    loop_var: passthrough_host
    label: "{{ passthrough_host }}"
  notify: Reload Nginx

- name: Upload Domain Configurations
  ansible.builtin.template:
    src: domain.conf.j2
    dest: "/etc/nginx/conf.d/{{ server.domain }}.conf"
    mode: '0644'
  loop: "{{ ingress_sites }}"
  loop_control:
    loop_var: server
  notify: Reload Nginx

- name: Remove Distro Default Site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Upload Catch-all Default Configuration
  ansible.builtin.template:
    src: default.conf.j2
    dest: /etc/nginx/conf.d/00-default.conf
    mode: '0644'
  notify: Reload Nginx

- name: Find Managed Domain Configurations
  ansible.builtin.find:
    paths: /etc/nginx/conf.d
    patterns: "*.{{ ingress_root_domain }}.conf"
  register: ingress_existing_domain_confs

- name: Remove Stale Domain Configurations
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ingress_existing_domain_confs.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: >-
    (item.path | basename | regex_replace('\.conf$', ''))
    not in (ingress_sites | map(attribute='domain') | list)
  notify: Reload Nginx

- name: Validate Nginx Configuration
  ansible.builtin.command: nginx -t
  changed_when: false
