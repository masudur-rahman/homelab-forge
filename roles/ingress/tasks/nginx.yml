---
- name: Install Nginx Stream Module
  ansible.builtin.apt:
    name: libnginx-mod-stream
    state: present
    update_cache: true

- name: Ensure Nginx Configuration Directory Exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/nginx/conf.d
    - /etc/nginx/streams.d

- name: Enable Stream Block Include In nginx.conf
  ansible.builtin.blockinfile:
    path: /etc/nginx/nginx.conf
    marker: "# {mark} ANSIBLE MANAGED: stream include"
    block: |
      stream {
          include /etc/nginx/streams.d/*.conf;
      }
  notify: Reload Nginx

- name: Upload TLS Passthrough Stream Configuration
  ansible.builtin.template:
    src: stream.conf.j2
    dest: /etc/nginx/streams.d/tls-passthrough.conf
    mode: '0644'
  notify: Reload Nginx

- name: Upload Domain Configurations
  ansible.builtin.template:
    src: domain.conf.j2
    dest: "/etc/nginx/conf.d/{{ server.domain }}.conf"
    mode: '0644'
  loop: "{{ ingress_sites }}"
  loop_control:
    loop_var: server
  notify: Reload Nginx

- name: Validate Nginx Configuration
  ansible.builtin.command: nginx -t
  changed_when: false
