---
- name: Ensure Project Directory Exists
  ansible.builtin.file:
    path: /opt/expense-tracker
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Create App Data Directory
  ansible.builtin.file:
    path: /opt/expense-tracker/app_data
    state: directory
    mode: '0755'

- name: Deploy App Configuration
  ansible.builtin.template:
    src: backend-config.yaml.j2
    dest: /opt/expense-tracker/backend-config.yaml
    mode: '0644'
  notify: Restart Expense Tracker

- name: Deploy Expense Tracker Dashboard Configuration
  ansible.builtin.template:
    src: dashboard-config.json.j2
    dest: /opt/expense-tracker/dashboard-config.json
    mode: '0644'
  notify: Restart Expense Tracker

- name: Deploy Docker Compose File
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/expense-tracker/docker-compose.yml
    mode: '0644'
  notify: Restart Expense Tracker

- name: Start Expense Tracker Stack
  community.docker.docker_compose_v2:
    project_src: /opt/expense-tracker
    state: present
    pull: always

- name: Cleanup Docker Resources
  ansible.builtin.import_tasks: cleanup.yml
  tags:
    - never
    - cleanup
