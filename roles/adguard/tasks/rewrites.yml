---
- name: Build desired rewrites list
  ansible.builtin.set_fact:
    adguard_desired_rewrites: >-
      {{ (ingress_sites | default([]) | map('combine', {'answer': ips.portal}) | list)
         + (ingress_passthrough_hosts | default([])
            | map('community.general.dict_kv', 'domain')
            | map('combine', {'answer': ips.portal}) | list)
         + (adguard_extra_rewrites | default([]) | list) }}
  run_once: true

- name: Fetch current AdGuard DNS rewrites via API
  ansible.builtin.uri:
    url: "http://{{ ips.adguard }}:{{ adguard_port_web }}/control/rewrite/list"
    method: GET
    url_username: "{{ adguard_admin_user | default(omit) }}"
    url_password: "{{ adguard_admin_password | default(omit) }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: _adguard_rewrites_current
  run_once: true
  check_mode: false

- name: Create lookup map of current rewrites
  ansible.builtin.set_fact:
    adguard_current_map: >-
      {{ dict(_adguard_rewrites_current.json | map(attribute='domain') | zip(
             _adguard_rewrites_current.json | map(attribute='answer')
         )) }}
  run_once: true

- name: Process each desired rewrite
  block:
    - name: Delete outdated rewrite (domain exists but answer differs)
      ansible.builtin.uri:
        url: "http://{{ ips.adguard }}:{{ adguard_port_web }}/control/rewrite/delete"
        method: POST
        body_format: json
        body: "{{ {'domain': item.domain, 'answer': adguard_current_map[item.domain]} }}"
        url_username: "{{ adguard_admin_user | default(omit) }}"
        url_password: "{{ adguard_admin_password | default(omit) }}"
        force_basic_auth: true
        status_code: 200
      loop: "{{ adguard_desired_rewrites }}"
      loop_control:
        label: "delete {{ item.domain }} (old answer: {{ adguard_current_map.get(item.domain, 'N/A') }})"
      when: >
        item.domain in adguard_current_map and
        adguard_current_map[item.domain] != item.answer
      run_once: true

    - name: Add missing or updated rewrite
      ansible.builtin.uri:
        url: "http://{{ ips.adguard }}:{{ adguard_port_web }}/control/rewrite/add"
        method: POST
        body_format: json
        body: "{{ item }}"
        url_username: "{{ adguard_admin_user | default(omit) }}"
        url_password: "{{ adguard_admin_password | default(omit) }}"
        force_basic_auth: true
        status_code: 200
      loop: "{{ adguard_desired_rewrites }}"
      loop_control:
        label: "add/update {{ item.domain }} -> {{ item.answer }} (old: {{ adguard_current_map.get(item.domain, 'new') }})"
      when: >
        item.domain not in adguard_current_map or
        adguard_current_map[item.domain] != item.answer
      run_once: true
