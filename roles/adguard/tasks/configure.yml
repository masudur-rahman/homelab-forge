---
- name: Install systemd service unit
  ansible.builtin.template:
    src: adguard.service.j2
    dest: /etc/systemd/system/adguard.service
    mode: '0644'
#    validate: 'systemd-analyze verify %s'
    backup: "{{ adguard_backup_configs | default(true) }}"
  notify: Restart AdGuard

- name: Start and enable AdGuard service
  ansible.builtin.systemd:
    name: adguard
    state: started
    enabled: true
    daemon_reload: true

- name: Flush handlers so pending restarts apply before health check
  ansible.builtin.meta: flush_handlers

- name: Wait for AdGuard DNS port to be listening
  ansible.builtin.wait_for:
    port: "{{ adguard_port_dns }}"
    host: 127.0.0.1
    timeout: 30
  when: adguard_wait_for_port | default(true)
  check_mode: false

- name: Configure DNS resolution safely (blockinfile)
  ansible.builtin.blockinfile:
    path: /etc/resolv.conf
    marker: "# {mark} ANSIBLE MANAGED - AdGuard DNS"
    block: |
      nameserver 127.0.0.1
      {% if fallback_dns | default('') %}
      nameserver {{ fallback_dns }}
      {% endif %}
      {% if search_domain | default('') %}
      search {{ search_domain }}
      {% endif %}
    insertafter: EOF
    backup: true
    create: true
    mode: '0644'
  notify: Reload systemd-resolved
