---
- name: Check current DNS connectivity
  ansible.builtin.command: host google.com
  register: _adguard_dns_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Bootstrap DNS & free port 53
  when: >-
    _adguard_dns_check.rc != 0 or
    (ansible_facts.services['systemd-resolved.service'] is defined and
     ansible_facts.services['systemd-resolved.service'].state == 'running')
  block:
    - name: Stop systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: false
        masked: true  # Prevent auto-restart

    - name: Remove broken resolv.conf symlink
      ansible.builtin.file:
        path: /etc/resolv.conf
        state: absent

    - name: Set temporary bootstrap DNS
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: "nameserver 1.1.1.1\n"
        mode: '0644'
        backup: true
