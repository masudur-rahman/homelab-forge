---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - adguard_bind_ip is defined
      - adguard_admin_password is defined
      - ips.adguard is defined
    fail_msg: "❌ Missing required variable for AdGuard deployment"
    success_msg: "✅ All pre-flight checks passed"
  tags: always

- name: Prepare AdGuard Environment
  ansible.builtin.import_tasks: prepare.yml
  tags:
    - adguard_prepare

- name: Install AdGuard Home
  ansible.builtin.import_tasks: install.yml
  tags:
    - adguard_install

- name: Render AdGuard Config
  ansible.builtin.import_tasks: config.yml
  tags:
    - adguard_config

- name: Configure AdGuard Service
  ansible.builtin.import_tasks: configure.yml
  tags:
    - adguard_service

- name: Setup HA Monitoring
  ansible.builtin.import_tasks: ha.yml
  when: ha_enabled | default(false)
  tags:
    - adguard_ha

- name: Sync DNS Rewrites
  ansible.builtin.import_tasks: rewrites.yml
  tags:
    - adguard_rewrites
    - dns_rewrites

- name: Post-deployment health check
  ansible.builtin.uri:
    url: "http://{{ ips.adguard }}:{{ adguard_port_web }}/control/status"
    method: GET
    url_username: "{{ adguard_admin_user | default(omit) }}"
    url_password: "{{ adguard_admin_password | default(omit) }}"
    force_basic_auth: true
    status_code: 200
    timeout: 10
  register: _adguard_health
  until: _adguard_health.status == 200
  retries: 3
  delay: 5
  check_mode: false
  tags:
    - adguard_health

- name: Cleanup AdGuard Stale Data
  ansible.builtin.import_tasks: cleanup.yml
  tags:
    - never
    - cleanup
