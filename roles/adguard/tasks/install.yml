---
- name: Create system group
  ansible.builtin.group:
    name: adguard
    system: true

- name: Create system user
  ansible.builtin.user:
    name: adguard
    group: adguard
    system: true
    shell: /usr/sbin/nologin
    home: /opt/adguard
    create_home: false

- name: Create installation directory
  ansible.builtin.file:
    path: /opt/adguard
    state: directory
    owner: adguard
    group: adguard
    mode: '0755'

- name: Check if AdGuard binary exists and get version
  ansible.builtin.command: /opt/adguard/AdGuardHome --version
  register: adguard_installed_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download and extract when version mismatch or missing
  when: >
    adguard_installed_version.rc != 0 or
    adguard_version not in adguard_installed_version.stdout
  block:
    - name: Download tarball
      ansible.builtin.get_url:
        url: "https://github.com/AdguardTeam/AdGuardHome/releases/download/{{ adguard_version }}/AdGuardHome_linux_amd64.tar.gz"
        dest: /tmp/AdGuardHome.tar.gz
        mode: '0644'

    - name: Extract AdGuard binary
      ansible.builtin.unarchive:
        src: /tmp/AdGuardHome.tar.gz
        dest: /opt/adguard
        remote_src: true
        extra_opts: [--strip-components=2]
        creates: /opt/adguard/AdGuardHome

- name: Ensure correct ownership
  ansible.builtin.file:
    path: /opt/adguard
    state: directory
    owner: adguard
    group: adguard
    recurse: true

- name: Ensure binary is executable
  ansible.builtin.file:
    path: /opt/adguard/AdGuardHome
    mode: '0755'
    owner: adguard
    group: adguard
