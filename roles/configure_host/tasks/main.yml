---
- name: Configure Base System
  ansible.builtin.include_tasks: system.yml
  tags:
    - system

- name: Configure DNS
  ansible.builtin.include_tasks: dns.yml
  when: "'gateway' not in group_names"
  tags:
    - dns

- name: Setup Docker Engine
  ansible.builtin.include_tasks: docker.yml
  tags:
    - docker

- name: Resize Disk Partition and Filesystem
  ansible.builtin.import_tasks: resize_disk.yml
  tags:
    - never
    - resize_disk

- name: Reboot Host
  ansible.builtin.import_tasks: reboot.yml
  tags:
    - never
    - reboot

- name: Cleanup System Resources
  ansible.builtin.import_tasks: cleanup.yml
  tags:
    - never
    - cleanup
